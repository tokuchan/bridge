# Facility registry (docs/adr/0014-documentation-site-architecture.md).
#
# Every header under include/**/*.hpp must be listed under exactly one
# facility's `headers` here -- scripts/docs-pages.py fails the docs
# build otherwise, the same severity Doxygen's own WARN_IF_UNDOCUMENTED
# already gives an undocumented symbol.
#
# `page` is the docs/pages/<page> Markdown file Doxygen renders as a
# `\page`. `cppreference` is the one cppreference.com URL used both for
# every promoted symbol's own `@see` line and for the facility page's
# generated table -- null when the facility has no real std:: mirror
# (Rivets' own detection concepts, version metadata). `header` is the
# real C++ standard header the facility mirrors (e.g. `<optional>`),
# used for the generated table's compact `<header>::name` stub and a
# prominent link right before each page's Synopsis -- also null for
# facilities with no real std:: mirror. Not derived from `cppreference`:
# that URL's own path categorization often doesn't match the symbol's
# actual header (`std::format`'s cppreference path says "utility", but
# its real header is `<format>`).
#
# scripts/docs-pages.py scaffolds docs/pages/<page> if it doesn't exist
# yet, then regenerates the marked `headers`/`symbols` blocks inside it
# from this file and Doxygen's XML output, every docs build.
#
# `example_headers` is the dependency-ordered (rivets -> truss -> deck)
# list of real bridge headers the page's own "## Example" code needs,
# hand-declared rather than auto-walked from #include directives (the
# facility's own author already knows the real order; an auto-walker is
# more moving parts for equivalent value here). scripts/docs-pages.py
# concatenates these files' contents (with every inter-bridge #include
# and #pragma once line stripped, since the content is now inlined),
# appends the Example's own code (same stripping), compiles the result
# standalone, and encodes it as a Compiler Explorer "Try it" link --
# failing `./bridge docs` loudly if the flattened form doesn't compile
# and run cleanly.

facilities:
  - name: optional
    page: optional.md
    cppreference: https://en.cppreference.com/w/cpp/utility/optional
    header: "<optional>"
    headers:
      - include/truss/cpp17/optional.hpp
      - include/deck/cpp17/optional.hpp
    example_headers:
      - include/rivets/features.hpp
      - include/truss/cpp17/optional.hpp
      - include/deck/cpp17/optional.hpp

  - name: expected
    page: expected.md
    cppreference: https://en.cppreference.com/w/cpp/utility/expected
    header: "<expected>"
    headers:
      - include/truss/cpp17/expected.hpp
      - include/deck/cpp17/expected.hpp
    example_headers:
      - include/rivets/diagnostics.hpp
      - include/rivets/features.hpp
      - include/truss/cpp17/expected.hpp
      - include/deck/cpp17/expected.hpp

  - name: format-print
    page: format-print.md
    # print/println have their own separate cppreference page
    # (https://en.cppreference.com/w/cpp/io/print) -- format's page is
    # used here as the one registry-level URL (docs/adr/0014 discloses
    # this simplification), and format-print.md's own prose links both.
    cppreference: https://en.cppreference.com/w/cpp/utility/format
    # Same disclosed simplification as the cppreference URL above:
    # print/println really live in <print>, not <format> -- format-print.md's
    # own prose discloses this.
    header: "<format>"
    headers:
      - include/truss/cpp17/format.hpp
      - include/truss/cpp17/print.hpp
      - include/deck/cpp17/format.hpp
      - include/deck/cpp17/print.hpp
    example_headers:
      - include/rivets/diagnostics.hpp
      - include/rivets/features.hpp
      - include/truss/cpp17/format.hpp
      - include/truss/cpp17/print.hpp
      - include/deck/cpp17/format.hpp
      - include/deck/cpp17/print.hpp

  - name: span
    page: span.md
    cppreference: https://en.cppreference.com/w/cpp/container/span
    header: "<span>"
    headers:
      - include/truss/cpp17/span.hpp
      - include/deck/cpp17/span.hpp
      # (docs/adr/0015-span-truss-owns-the-class.md, task #80).
    example_headers:
      - include/rivets/features.hpp
      - include/truss/cpp17/span.hpp
      - include/deck/cpp17/span.hpp

  - name: source_location
    page: source_location.md
    cppreference: https://en.cppreference.com/w/cpp/utility/source_location
    header: "<source_location>"
    headers:
      - include/truss/cpp17/source_location.hpp
      - include/deck/cpp17/source_location.hpp
    example_headers:
      - include/rivets/features.hpp
      - include/rivets/detail/detector.hpp
      - include/rivets/clang.hpp
      - include/rivets/diagnostics.hpp
      - include/truss/cpp17/source_location.hpp
      - include/deck/cpp17/source_location.hpp

  - name: jthread
    page: jthread.md
    cppreference: https://en.cppreference.com/w/cpp/thread/jthread
    # stop_token/stop_source's own real header is <stop_token>, not
    # <thread> -- same disclosed simplification as format-print's
    # print/println living in <print> (docs/adr/0017's amendment,
    # once the full page is written).
    header: "<thread>"
    headers:
      - include/truss/cpp17/stop_token.hpp
      - include/truss/cpp17/jthread.hpp
      - include/deck/cpp17/stop_token.hpp
      - include/deck/cpp17/jthread.hpp
    example_headers:
      - include/rivets/features.hpp
      - include/rivets/detail/detector.hpp
      - include/rivets/libstdcxx.hpp
      - include/truss/cpp17/stop_token.hpp
      - include/truss/cpp17/jthread.hpp
      - include/deck/cpp17/stop_token.hpp
      - include/deck/cpp17/jthread.hpp

  - name: detectors
    page: detectors.md
    cppreference: null
    header: null
    headers:
      - include/rivets/boost.hpp
      - include/rivets/clang.hpp
      - include/rivets/gcc.hpp
      - include/rivets/libcxx.hpp
      - include/rivets/libstdcxx.hpp
      - include/rivets/msvc.hpp
      - include/rivets/msvc_stl.hpp
      - include/rivets/standard.hpp
      - include/rivets/detail/detector.hpp
    example_headers:
      - include/rivets/detail/detector.hpp
      - include/rivets/gcc.hpp

  - name: feature-tests
    page: feature-tests.md
    cppreference: https://en.cppreference.com/w/cpp/feature_test
    # <version> is the real C++20 header exposing every __cpp_lib_*
    # feature-test macro without pulling in the library behind each --
    # not null, unlike detectors/diagnostics (docs/adr/0007).
    header: "<version>"
    headers:
      - include/rivets/features.hpp
    example_headers:
      - include/rivets/features.hpp

  - name: diagnostics
    page: diagnostics.md
    cppreference: null
    header: null
    headers:
      - include/rivets/diagnostics.hpp
    example_headers:
      - include/rivets/diagnostics.hpp

  - name: version
    page: version.md
    cppreference: null
    header: null
    headers:
      - include/truss/cpp17/version.hpp
      - include/deck/cpp17/version.hpp
    example_headers:
      - include/truss/cpp17/version.hpp
      - include/deck/cpp17/version.hpp
